services:
  web:
    build:
      context: .
      args:
        # Variáveis NEXT_PUBLIC_* são inlinadas no bundle em tempo de build —
        # precisam estar aqui, não só em `environment`.
        NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${NEXT_PUBLIC_RECAPTCHA_SITE_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
    ports:
      - "3000:3000"
    environment:
      # Segredos de servidor — lidos só em runtime, nunca vão para o bundle.
      - BREVO_API_KEY=${BREVO_API_KEY}
      - RECAPTCHA_SECRET_KEY=${RECAPTCHA_SECRET_KEY}
      # Sem estas o painel /admin, o blog e o rate limiting não funcionam: todo
      # acesso ao Firestore/Storage passa pelo Admin SDK.
      - FIREBASE_SERVICE_ACCOUNT_B64=${FIREBASE_SERVICE_ACCOUNT_B64}
      - FIREBASE_STORAGE_BUCKET=${FIREBASE_STORAGE_BUCKET}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
      - SESSION_MAX_AGE_HOURS=${SESSION_MAX_AGE_HOURS:-8}
    restart: unless-stopped
